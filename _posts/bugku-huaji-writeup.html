<h1>Bugku 滑稽 题目Writeup</h1>
<p>平台：Bugku CTF</p >
<p>题型：Web</p >

<h2>题目描述</h2>
<p>打开页面满屏都是大黄脸表情，速度很快，没有头绪。</p >

<h2>解题思路</h2>
<p>1. 先找画面里有没有flag,并，没有发现</p >
<p>2. 束手无策</p >
<p>3. 向高年级学长寻求帮助</p >

<h2>详细步骤</h2>
<p>第一步：打开网页，页面布满大黄脸图片。</p >
<p>第二步：按下Ctrl+U打开源码页面。</p >
<p>第三步：按Ctrl+F搜索关键词 flag。</p >
<p>第四步：找到注释包裹的flag，复制提交。</p >

<h2>收获</h2>
<p>知道了CtrlU快捷键查看源代码，Ctrl+f快速搜索。</p >
